# ServiceDesk UTA — endurecimiento de SSH (drop-in para /etc/ssh/sshd_config.d/)
# Lo instala scripts/install-server.sh SOLO si ya existe una clave pública
# autorizada para el administrador (evita quedar fuera del servidor) y tras
# validar con `sshd -t`. Para revertir: borrar este archivo y `systemctl reload ssh`.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
